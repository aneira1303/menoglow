services:
  - type: web
    name: menoglow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: JWT_SECRET, generateValue: true}
      - {key: DATABASE_URL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: CORS_ORIGINS, sync: false}
      - {key: RAZORPAY_KEY_ID, sync: false}
      - {key: RAZORPAY_KEY_SECRET, sync: false}
      - {key: CLOUDINARY_URL, sync: false}
