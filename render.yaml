databases:
  - name: menoglow-db
    plan: free
services:
  - type: web
    name: menoglow
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: menoglow-db, property: connectionString}
      - {key: JWT_SECRET, generateValue: true}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: RAZORPAY_KEY_ID, sync: false}
      - {key: RAZORPAY_KEY_SECRET, sync: false}
      - {key: CLOUDINARY_URL, sync: false}
